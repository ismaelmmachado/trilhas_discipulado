schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
context: |
  Projeto: "A Jornada do Discípulo" — hub das trilhas de discipulado da Comunidade Vitral
  (IPIB São José do Rio Preto). Site estático publicado via GitHub Pages em
  ismaelmmachado/trilhas_discipulado (https://ismaelmmachado.github.io/trilhas_discipulado/).

  Tech stack: HTML5 + CSS puro (sem build step, zero dependências).
  - Fontes: Playfair Display (títulos) e Inter (corpo), via Google Fonts.
  - Design tokens: css/tokens.css com paleta por estação via atributo
    data-etapa (1=verde, 2=dourado, 3=azul marinho).
  - Estilo em css/estilo.css (mobile-first).

  Estrutura do hub: header com bússola (🧭), hero, 3 estações em cards conectados
  por linha tracejada, apex "DISCÍPULO" com SVG (caminhante rumo à cruz) e fórmula
  SER + FAZER + SABER, footer.

  Trilhas existentes (repos separados, já publicados):
  - Estação 1: https://ismaelmmachado.github.io/trilha_de_novos/index.html
  - Estação 2: https://ismaelmmachado.github.io/trilha_praticando_o_caminho/index.html
  - Estação 3 (Fundamentos da Fé): ainda não publicada — card "Em breve" no hub.

  Idioma dos documentos: português (pt-BR).

  REGRA DE OURO (git — nunca esquecer):
  - "Salva" → commit, push e tag em "homologacao" (branch de trabalho padrão).
  - "Salva em main" (explícito) → "main".
  - Tag: usar sempre a tag do contexto em que estamos trabalhando.
  - Tag específica informada pelo usuário tem precedência sobre qualquer padrão.
  - "main" só é usado quando solicitado explicitamente.
  Contexto atual: hub journey-hub → tag v1.0.0 (anotada). Mudanças sem bump
  (housekeeping/docs) mantêm a tag do contexto, sem mover tag já publicada.

  Deploy (GitHub Pages): Pages serve a raiz da branch "homologacao"; sem build
  step, basta git push origin homologacao. URL canônica:
  https://ismaelmmachado.github.io/trilhas_discipulado/

